<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Sorpresa de Cumpleaños!</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Bubblegum Sans & Fredoka para un toque muy infantil y divertido -->
    <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', cursive, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            overflow-x: hidden;
        }
        .title-font {
            font-family: 'Bubblegum Sans', cursive;
        }
        /* Copos de nieve cayendo */
        .snowflake {
            position: fixed;
            top: -10px;
            z-index: 1000;
            user-select: none;
            pointer-events: none;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% {
                transform: translateY(-10vh) translateX(0);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) translateX(20px);
                opacity: 0.2;
            }
        }
        /* Luces de navidad parpadeantes */
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        .bulb-red { animation: twinkle 1.5s infinite; }
        .bulb-green { animation: twinkle 1.2s infinite 0.3s; }
        .bulb-gold { animation: twinkle 1.8s infinite 0.6s; }
    </style>
</head>
<body class="min-h-screen text-white flex flex-col items-center justify-between p-4 relative">

    <!-- Guirnalda de luces superior -->
    <div class="w-full max-w-4xl flex justify-around py-2 z-10">
        <div class="w-4 h-4 rounded-full bg-red-500 shadow-[0_0_12px_#ef4444] bulb-red"></div>
        <div class="w-4 h-4 rounded-full bg-yellow-400 shadow-[0_0_12px_#facc15] bulb-gold"></div>
        <div class="w-4 h-4 rounded-full bg-green-500 shadow-[0_0_12px_#22c55e] bulb-green"></div>
        <div class="w-4 h-4 rounded-full bg-red-500 shadow-[0_0_12px_#ef4444] bulb-red"></div>
        <div class="w-4 h-4 rounded-full bg-yellow-400 shadow-[0_0_12px_#facc15] bulb-gold"></div>
        <div class="w-4 h-4 rounded-full bg-green-500 shadow-[0_0_12px_#22c55e] bulb-green"></div>
        <div class="w-4 h-4 rounded-full bg-red-500 shadow-[0_0_12px_#ef4444] bulb-red"></div>
    </div>

    <!-- Contenedor Principal -->
    <main class="w-full max-w-lg mx-auto text-center z-10 my-auto">
        
        <!-- Título principal con MÓNICA y el mensaje de frío -->
        <h1 class="title-font text-5xl md:text-6xl text-yellow-300 drop-shadow-[0_4px_6px_rgba(0,0,0,0.5)] mb-2 tracking-wide">
            MÓNICA
        </h1>
        <p class="text-xl md:text-2xl text-blue-200 font-bold mb-8 drop-shadow">
            ¡Frriii...o hace hoy! ❄️
        </p>

        <!-- SECCIÓN DE CUENTA ATRÁS -->
        <div id="countdown-container" class="bg-white/10 backdrop-blur-md border-4 border-dashed border-yellow-300 rounded-3xl p-6 shadow-2xl mb-6">
            <h2 class="text-xl md:text-2xl font-bold text-red-200 mb-4 flex items-center justify-center gap-2">
                <span>🎁</span> Faltan muy poquito para descubrir tu regalo <span>🎁</span>
            </h2>
            
            <div class="grid grid-cols-4 gap-2 text-center my-4">
                <div class="bg-red-900/60 border-2 border-red-400 rounded-2xl p-2 shadow-inner">
                    <span id="days" class="text-3xl md:text-4xl font-bold text-yellow-300 block">00</span>
                    <span class="text-xs uppercase tracking-wider text-red-200">Días</span>
                </div>
                <div class="bg-red-900/60 border-2 border-red-400 rounded-2xl p-2 shadow-inner">
                    <span id="hours" class="text-3xl md:text-4xl font-bold text-yellow-300 block">00</span>
                    <span class="text-xs uppercase tracking-wider text-red-200">Horas</span>
                </div>
                <div class="bg-red-900/60 border-2 border-red-400 rounded-2xl p-2 shadow-inner">
                    <span id="minutes" class="text-3xl md:text-4xl font-bold text-yellow-300 block">00</span>
                    <span class="text-xs uppercase tracking-wider text-red-200">Min</span>
                </div>
                <div class="bg-red-900/60 border-2 border-red-400 rounded-2xl p-2 shadow-inner">
                    <span id="seconds" class="text-3xl md:text-4xl font-bold text-yellow-300 block">00</span>
                    <span class="text-xs uppercase tracking-wider text-red-200">Seg</span>
                </div>
            </div>
            
            <p id="status-text" class="text-sm text-yellow-200/90 mt-3 font-semibold">
                La gran sorpresa se abrirá el 7 de noviembre de 2026 a las 00:00
            </p>
        </div>

        <!-- SECCIÓN DEL REGALO / IMAGEN (Oculta hasta que llegue el momento) -->
        <div id="gift-section" class="hidden transition-all duration-700 ease-in-out">
            <div class="bg-gradient-to-b from-red-600 to-red-800 p-4 rounded-3xl border-4 border-yellow-400 shadow-2xl relative">
                <div class="absolute -top-4 left-1/2 transform -translate-x-1/2 bg-yellow-400 text-red-900 font-extrabold px-4 py-1 rounded-full text-sm shadow-md">
                    🌟 ¡FELIZ CUMPLEAÑOS! 🌟
                </div>
                
                <div class="mt-3 rounded-2xl overflow-hidden border-2 border-yellow-200/50 shadow-inner bg-white">
                    <img src="image.png" alt="Vale de Regalo" class="w-full h-auto object-cover">
                </div>

                <div class="mt-4">
                    <a href="image.png" download="Regalo_Cumpleanos.png" class="inline-block bg-yellow-400 hover:bg-yellow-300 text-red-950 font-bold px-6 py-3 rounded-2xl shadow-lg transform hover:-translate-y-1 transition text-lg">
                        📥 Descargar Tu Regalo
                    </a>
                </div>
            </div>
        </div>

    </main>

    <!-- Pie de página -->
    <footer class="w-full text-center py-4 text-xs text-yellow-200/60 z-10">
        Hecho con muchísimo amor ❤️🎄
    </footer>

    <!-- Script de cuenta atrás y efectos -->
    <script>
        // Fecha objetivo: 7 de noviembre de 2026 a las 00:00:00
        const targetDate = new Date("November 7, 2026 00:00:00").getTime();

        const countdownInterval = setInterval(function() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Mostrar en pantalla asegurando dos dígitos
            document.getElementById("days").innerText = String(days).padStart(2, '0');
            document.getElementById("hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');

            // Si la cuenta atrás ha terminado
            if (distance < 0) {
                clearInterval(countdownInterval);
                document.getElementById("countdown-container").classList.add("hidden");
                document.getElementById("gift-section").classList.remove("hidden");
            }
        }, 1000);

        // Generar copos de nieve dinámicos
        function createSnowflakes() {
            const snowflakeCount = 35;
            for (let i = 0; i < snowflakeCount; i++) {
                const snowflake = document.createElement('div');
                snowflake.classList.add('snowflake');
                snowflake.innerHTML = '❄';
                snowflake.style.left = Math.random() * 100 + 'vw';
                snowflake.style.top = -20 + Math.random() * -100 + 'vh';
                snowflake.style.fontSize = (Math.random() * 14 + 10) + 'px';
                snowflake.style.opacity = Math.random() * 0.7 + 0.3;
                snowflake.style.animationDuration = (Math.random() * 5 + 3) + 's';
                snowflake.style.animationDelay = (Math.random() * 5) + 's';
                document.body.appendChild(snowflake);
            }
        }
        createSnowflakes();
    </script>
</body>
</html>
